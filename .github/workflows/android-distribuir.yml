# Android · APK a testers (docs/DISTRIBUCION.md). Modelo de APL-Livic-movil, con keystore de release real,
# grupos de testers, notas desde Conventional Commits, AAB y puerta de calidad antes de compilar.
#   - Manual: Actions → «Android · APK a testers» → Run workflow (rama, notas, grupos).
#   - Por tag: git tag v0.2.0 && git push origin v0.2.0 (el tag debe coincidir con la versión de package.json).
name: Android · APK a testers

on:
  workflow_dispatch:
    inputs:
      notas:
        description: Notas para los testers
        required: false
        default: Build manual desde GitHub Actions
      grupos:
        description: Grupos de testers de Firebase App Distribution (separados por coma)
        required: false
        default: equipo
  push:
    tags: ['v*']

concurrency:
  group: distribuir-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distribuir:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      GRUPOS: ${{ github.event.inputs.grupos || 'equipo,sebastian' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comprobar secrets y variables
        env:
          API_URL: ${{ secrets.API_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          faltan=()
          for v in API_URL FIREBASE_SERVICE_ACCOUNT ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD FIREBASE_APP_ID; do
            [ -n "${!v}" ] || faltan+=("$v")
          done
          if [ ${#faltan[@]} -gt 0 ]; then
            echo "::error::Faltan secrets/variables del repo: ${faltan[*]}. Ver docs/DISTRIBUCION.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci

      - name: Puerta de calidad
        run: npm run calidad

      - name: Versión
        id: version
        run: |
          paquete=$(node -p "require('./package.json').version")
          codigo=${{ github.run_number }}
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            nombre="${GITHUB_REF_NAME#v}"
            if [ "$nombre" != "$paquete" ]; then
              echo "::error::El tag ${GITHUB_REF_NAME} no coincide con package.json (${paquete}). Sube la versión antes de etiquetar."
              exit 1
            fi
          else
            nombre="$paquete"
          fi
          echo "nombre=$nombre" >> "$GITHUB_OUTPUT"
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"

      - name: Notas de versión
        id: notas
        env:
          NOTAS_MANUALES: ${{ github.event.inputs.notas }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            anterior=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            rango="${anterior:+$anterior..}${GITHUB_REF_NAME}"
            {
              echo "${GITHUB_REF_NAME} (build ${{ steps.version.outputs.codigo }})"
              for tipo in feat fix perf; do
                case $tipo in feat) titulo="Novedades";; fix) titulo="Correcciones";; perf) titulo="Rendimiento";; esac
                lineas=$(git log "$rango" --no-merges --format='%s' | grep -E "^${tipo}(\(|:)" | sed -E 's/^[a-z]+(\([^)]*\))?: /- /' || true)
                if [ -n "$lineas" ]; then printf '\n%s:\n%s\n' "$titulo" "$lineas"; fi
              done
            } > notas.txt
          else
            echo "${NOTAS_MANUALES:-Build manual} (${{ steps.version.outputs.nombre }}, build ${{ steps.version.outputs.codigo }}, rama ${GITHUB_REF_NAME})" > notas.txt
          fi
          cat notas.txt

      - name: Entorno y keystore
        env:
          API_URL: ${{ secrets.API_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf 'API_URL=%s\nAPP_ENV=prod\n' "$API_URL" > .env
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compilar APK y AAB de release
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ENVFILE: .env
        run: |
          node scripts/gradle.mjs assembleRelease bundleRelease --no-daemon \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -PversionCodeOverride=${{ steps.version.outputs.codigo }} \
            -PversionNameOverride=${{ steps.version.outputs.nombre }}
          mkdir -p dist
          base="inglesconsebas-${{ steps.version.outputs.nombre }}-${{ steps.version.outputs.codigo }}"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$base.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/$base.aab"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: inglesconsebas-${{ steps.version.outputs.nombre }}-${{ steps.version.outputs.codigo }}
          path: dist/
          retention-days: 30

      - name: Distribuir a testers (Firebase App Distribution)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@13 appdistribution:distribute dist/*.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$GRUPOS" \
            --release-notes-file notas.txt

      - name: Limpiar credenciales
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/firebase-sa.json" .env

      - name: Resumen
        if: success()
        run: |
          {
            echo "## Android · APK a testers"
            echo "| Versión | Build | Grupos | Rama/tag |"
            echo "|---|---|---|---|"
            echo "| ${{ steps.version.outputs.nombre }} | ${{ steps.version.outputs.codigo }} | $GRUPOS | ${GITHUB_REF_NAME} |"
            echo
            echo '```'
            cat notas.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
